{% extends "base.html" %}
{% block title %}Reschedule {{ a.id }}{% endblock %}
{% block main %}
<h1>Reschedule <span class="appt-id">{{ a.id }}</span></h1>
<p>{{ a.patient }} with {{ a.clinician }}, currently <time datetime="{{ a.start }}">{{ a.start | pretty }}</time></p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/reschedule">
  <input type="hidden" name="appointment_id" value="{{ a.id }}">
  <label for="new_start">New start</label>
  <input id="new_start" type="datetime-local" name="new_start">
  <button type="submit">Save</button>
</form>
{% endblock %}
